<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zomato Clone (Tomato)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="app-banner">
      <img src="https://via.placeholder.com/100x30?text=Get+the+app" alt="Get the app">
    </div>
    <div class="main-banner">
      <h1>tomato</h1>
      <p>Discover the best food & drinks in Kolkata</p>
      <div class="search-box">
        <select>
          <option>Kolkata</option>
          <option>Delhi</option>
        </select>
        <input type="text" placeholder="Search for restaurant, cuisine or a dish">
      </div>
    </div>
  </header>

  <section class="categories">
    <div class="category"><img src="https://via.placeholder.com/100" alt=""><p>Go out for a meal</p></div>
    <div class="category"><img src="https://via.placeholder.com/100" alt=""><p>Nightlife & Clubs</p></div>
    <div class="category"><img src="https://via.placeholder.com/100" alt=""><p>Zomato Pro</p></div>
    <div class="category"><img src="https://via.placeholder.com/100" alt=""><p>Order Food Online</p></div>
  </section>
</body>
</html>
